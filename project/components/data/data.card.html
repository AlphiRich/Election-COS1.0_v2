<!-- @dsCard group="Components" viewport="700x340" name="Data" subtitle="Table with Ink header rule; Stat figures in Plex Mono" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../components/ecos-loader.js"></script>
</head><body style="padding:24px;background:var(--paper)">
<div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.RoleBadge) return v; } catch (e) {} } return {}; })();

const { Table, Stat, CodeTag, StatusBadge } = NS;
const rows=[{w:'NW405-W07',vd:4,c:12,s:'built'},{w:'NW405-W12',vd:3,c:9,s:'built'},{w:'NW405-W19',vd:5,c:0,s:'roadmap'}];
function Demo(){ return (
<div style={{display:'flex',flexDirection:'column',gap:24}}>
  <div style={{display:'flex',gap:48}}><Stat label="Active delegations" value="47" delta="6 expire this week" /><Stat label="Voting districts" value="108" /><Stat label="Package" value="R1,800" delta="per ward" /></div>
  <Table dense columns={[{key:'w',label:'Ward',render:r=><CodeTag>{r.w}</CodeTag>},{key:'vd',label:'VDs',numeric:true},{key:'c',label:'Canvassers',numeric:true},{key:'s',label:'Status',render:r=><StatusBadge status={r.s}>{r.s==='built'?'Active':'Seeding'}</StatusBadge>}]} rows={rows} />
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
