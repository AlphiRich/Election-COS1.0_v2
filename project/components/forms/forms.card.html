<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../components/ecos-loader.js"></script>
</head><body style="padding:24px;background:var(--paper)">
<div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.RoleBadge) return v; } catch (e) {} } return {}; })();

const { Field, Input, Select, Checkbox, Radio, Switch } = NS;
function Demo(){ return (
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 24px'}}>
  <Field label="Canvasser" hint="Search by name or ID" htmlFor="a"><Input id="a" placeholder="Thandiwe Mokoena" /></Field>
  <Field label="Ward scope" htmlFor="b"><Input id="b" mono defaultValue="NW405-W07" /></Field>
  <Field label="Role" htmlFor="c"><Select id="c" options={[{value:'WARD_LEAD',label:'Field Coordinator · WARD_LEAD'},{value:'VD_CAPTAIN',label:'VD Captain · VD_CAPTAIN'}]} /></Field>
  <Field label="Valid until" error="Required — delegations must expire" htmlFor="d"><Input id="d" invalid placeholder="YYYY-MM-DD" mono /></Field>
  <div style={{display:'flex',flexDirection:'column',gap:10}}><Checkbox label="household.read" defaultChecked /><Checkbox label="household.write" defaultChecked /><Checkbox label="pr_list.export" disabled /></div>
  <div style={{display:'flex',flexDirection:'column',gap:10}}><Radio name="s" label="Entire ward" defaultChecked /><Radio name="s" label="Selected voting districts" /><Switch label="Can delegate" defaultChecked /></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
