<!-- @dsCard group="Colors" viewport="700x200" name="Status: Built, Roadmap" subtitle="Claim badges and state markers" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--green);"></div><div style="font:700 14px/18px var(--font-display)">Built Green</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#2F7E4A · --green</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Success, complete, confirmed, active</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--roadmap);"></div><div style="font:700 14px/18px var(--font-display)">Roadmap</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#8A6A2A · --roadmap</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Planned, in progress, expiring; warning text</div></div><div style="display:flex;flex-direction:column;gap:10px;justify-content:center"><span class="ecos-badge ecos-badge--built">Built · Complete</span><span class="ecos-badge ecos-badge--roadmap">Roadmap · In progress</span><span class="ecos-badge ecos-badge--neutral">Revoked</span><span class="ecos-badge ecos-badge--ink">Offline</span></div></div>
</body></html>
