<!-- @dsCard group="Spacing" viewport="700x170" name="Radii, borders, elevation" subtitle="Near-square corners, hairline edges, almost no shadow" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:var(--radius-1);border:1px solid var(--line-strong)"></div><div class="ecos-mono" style="font-size:11px;color:var(--slate)">radius-1 · 2px</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:var(--radius-2);border:1px solid var(--line-strong)"></div><div class="ecos-mono" style="font-size:11px;color:var(--slate)">radius-2 · 4px</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:var(--border-hair)"></div><div class="ecos-mono" style="font-size:11px;color:var(--slate)">border-hair</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;box-shadow:var(--shadow-2);background:var(--paper-raised)"></div><div class="ecos-mono" style="font-size:11px;color:var(--slate)">shadow-2</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;box-shadow:var(--shadow-3);background:var(--paper-raised)"></div><div class="ecos-mono" style="font-size:11px;color:var(--slate)">shadow-3 · dialogs</div></div></div>
</body></html>
