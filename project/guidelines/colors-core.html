<!-- @dsCard group="Colors" viewport="700x200" name="Core: Ink, Paper, Line" subtitle="The paper-and-ink civic document" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--ink);"></div><div style="font:700 14px/18px var(--font-display)">Ink</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#1A2246 · --ink</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Primary text, headings, dark fields, footer</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--paper);border:1px solid var(--line)"></div><div style="font:700 14px/18px var(--font-display)">Paper</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#F7F4EE · --paper</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Page background — the neutral canvas</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--line);border:1px solid var(--line)"></div><div style="font:700 14px/18px var(--font-display)">Line</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#DCD6C8 · --line</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Borders only — never text or fills</div></div></div>
</body></html>
