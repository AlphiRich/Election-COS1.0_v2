<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div style="display:flex;flex-direction:column;gap:8px"><div class="ecos-label" style="color:var(--green)">Do</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-check-circle ecos-icon" style="color:var(--green)"></i>Use the approved colours</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-check-circle ecos-icon" style="color:var(--green)"></i>Use approved typography</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-check-circle ecos-icon" style="color:var(--green)"></i>Follow layout systems</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-check-circle ecos-icon" style="color:var(--green)"></i>Prioritise clarity and access</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-check-circle ecos-icon" style="color:var(--green)"></i>Keep it neutral and civic</div></div><div style="display:flex;flex-direction:column;gap:8px"><div class="ecos-label" style="color:var(--roadmap)">Don't</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-x-circle ecos-icon" style="color:var(--roadmap)"></i>Use unauthorised or party logos</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-x-circle ecos-icon" style="color:var(--roadmap)"></i>Add new colours or party-colour fields</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-x-circle ecos-icon" style="color:var(--roadmap)"></i>Distort typography</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-x-circle ecos-icon" style="color:var(--roadmap)"></i>Use ballot-box clichés</div><div style="display:flex;gap:8px;font-size:14px"><i class="ph-duotone ph-x-circle ecos-icon" style="color:var(--roadmap)"></i>Personalise politics or show candidate faces</div></div></div>
</body></html>
