<!-- @dsCard group="Colors" viewport="700x200" name="Action: Amber, Blue" subtitle="Amber is a fill, never text on Paper" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--amber);"></div><div style="font:700 14px/18px var(--font-display)">Amber</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#B7913F · --amber</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Primary CTA fill (Ink label), status markers, focus on Ink</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--blue);"></div><div style="font:700 14px/18px var(--font-display)">Blue</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#33427E · --blue</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Links, secondary actions, info, focus ring on Paper</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-1);background:var(--slate);"></div><div style="font:700 14px/18px var(--font-display)">Slate</div><div class="ecos-mono" style="font-size:12px;line-height:16px;color:var(--slate)">#6A6E7E · --slate</div><div style="font-size:12px;line-height:18px;color:var(--ink)">Secondary text, captions, inactive</div></div></div>
</body></html>
