<!-- @dsCard group="Type" viewport="700x300" name="Body & UI: Public Sans 400/600" subtitle="Legibility for dense reports and menus — line-height 1.65" -->
<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script>window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "align": "Justify",
  "paragraphGap": 14,
  "titleCase": true
}/*EDITMODE-END*/;</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head>
<body style="padding:24px;background:var(--paper)">
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const MINOR = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','per','the','to','vs','via','with']);
const titleCase = s => s.split(' ').map((w, i, a) => {
  if (/[A-Z].*[A-Z]|\d/.test(w) || w.includes('-COS')) return w;
  const lw = w.toLowerCase();
  return i !== 0 && i !== a.length - 1 && MINOR.has(lw) ? lw : lw.charAt(0).toUpperCase() + lw.slice(1);
}).join(' ');
function Card() {
  const [t, setTweak] = useTweaks(window.TWEAK_DEFAULTS);
  const T = s => t.titleCase ? titleCase(s) : s;
  const body = { textAlign: t.align === 'Justify' ? 'justify' : 'left', hyphens: t.align === 'Justify' ? 'auto' : 'manual', textWrap: t.align === 'Justify' ? 'wrap' : 'pretty' };
  return (
    <React.Fragment>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
        <div style={{ maxWidth: '60ch', display: 'flex', flexDirection: 'column', gap: t.paragraphGap }}>
          <h4>{T('Consent is captured at the door')}</h4>
          <p style={body}>Election-COS connects your war room to your canvassers in real time. Consent is captured at the door, logged once and never re-asked.</p>
          <p style={body}>Work done offline is kept on the phone and sent when signal returns, so nothing is lost in a dead zone.</p>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ fontWeight: 600 }}>{T('Semibold 600 — labels, menu items, emphasis')}</div>
          <div style={{ fontSize: 14, lineHeight: '23px' }}>Small 14/23 — table cells, secondary UI</div>
          <div style={{ fontSize: 12, lineHeight: '20px', color: 'var(--slate)' }}>Caption 12/20 — Slate, metadata, hints</div>
          <div className="ecos-label">System label · uppercase 0.08em</div>
        </div>
      </div>
      <TweaksPanel>
        <TweakSection label="Body text" />
        <TweakRadio label="Alignment" value={t.align} options={['Left', 'Justify']} onChange={v => setTweak('align', v)} />
        <TweakSlider label="Paragraph spacing" value={t.paragraphGap} min={0} max={32} step={2} unit="px" onChange={v => setTweak('paragraphGap', v)} />
        <TweakSection label="Titles" />
        <TweakToggle label="Title Case" value={t.titleCase} onChange={v => setTweak('titleCase', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body></html>
