<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Phosphor duotone, on currentColor (CDN substitute)" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--paper)">
<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:12px"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-shield-check" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">shield-check</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-key" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">key</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-users-three" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">users-three</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-map-pin" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">map-pin</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-identification-card" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">identification-card</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-clock-countdown" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">clock-countdown</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-wifi-slash" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">wifi-slash</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-lock-simple" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">lock-simple</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-handshake" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">handshake</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-scroll" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">scroll</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-seal-check" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">seal-check</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-warning" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">warning</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-check-circle" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">check-circle</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-map-trifold" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">map-trifold</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-squares-four" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">squares-four</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-arrows-clockwise" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">arrows-clockwise</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-user-plus" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">user-plus</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-prohibit" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">prohibit</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-calculator" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">calculator</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i class="ph-duotone ph-chart-bar" style="font-size:28px;color:var(--ink)"></i><span class="ecos-mono" style="font-size:9px;line-height:12px;color:var(--slate);text-align:center">chart-bar</span></div></div>
</body></html>
